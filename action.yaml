    description: "Response from the firebase command executed"

runs:
  using: "docker"
  image: "docker://w9jds/firebase-action:v15.33.0@sha256:cf8886b558c7b2d7fadecd14e0b1dec2203eaafe31b6d7143c0fc9eaf20d78e6"
