    description: "Response from the firebase command executed"

runs:
  using: "docker"
  image: "docker://w9jds/firebase-action:v15.28.1@sha256:bb15222c8d3e9d021944f8b13f4457745c6b3b3d903fdf5fdabbb9dc1ac55336"
