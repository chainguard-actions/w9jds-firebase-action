name: Test GCP application credentials auth path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a dummy GCP credentials file
        run: |
          mkdir -p /tmp/gcp-creds
          cat > /tmp/gcp-creds/sa.json <<'EOF'
          {
            "type": "service_account",
            "project_id": "test-project",
            "private_key_id": "key-id",
            "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKFPmBCBMGdBMFGMSMH\n-----END RSA PRIVATE KEY-----\n",
            "client_email": "test@test-project.iam.gserviceaccount.com",
            "client_id": "123456789",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF

      - name: Run firebase --version with GOOGLE_APPLICATION_CREDENTIALS
        id: action
        uses: .
        continue-on-error: true
        with:
          args: --version
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-creds/sa.json

      - name: Assert action ran (credential check passed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT exit 126 (missing credentials).
          # It may succeed or fail depending on whether the fake SA key is accepted,
          # but it must have attempted to run the firebase command.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version succeeded with GOOGLE_APPLICATION_CREDENTIALS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past credential check but firebase CLI rejected the fake key"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
