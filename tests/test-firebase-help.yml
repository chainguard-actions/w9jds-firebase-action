name: Test firebase help with token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          # Provide a fake token so the credential check in entrypoint.sh passes.
          # firebase --help does not contact Firebase servers, so no real token needed.
          FIREBASE_TOKEN: "1//fake-token-for-help-test"
        with:
          args: --help
      - name: Assert action ran (help succeeded or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --help ran successfully with FIREBASE_TOKEN set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (firebase CLI may require auth even for --help)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
