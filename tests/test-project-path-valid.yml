name: Test valid PROJECT_PATH
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project dir
        run: |
          mkdir -p "$GITHUB_WORKSPACE/firebase-project"
          echo '{}' > "$GITHUB_WORKSPACE/firebase-project/firebase.json"
      - id: action
        uses: .
        with:
          args: --version
        env:
          FIREBASE_TOKEN: dummy-token
          PROJECT_PATH: firebase-project
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success with valid PROJECT_PATH"
            exit 1
          fi
          echo "PASS"
