name: Test firebase with GOOGLE_APPLICATION_CREDENTIALS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create fake credentials file
        run: |
          mkdir -p /tmp/gcp
          cat > /tmp/gcp/credentials.json <<'EOF'
          {
            "type": "service_account",
            "project_id": "test-project",
            "private_key_id": "key123",
            "private_key": "fake-key",
            "client_email": "test@test-project.iam.gserviceaccount.com",
            "client_id": "123456",
            "auth_uri": "https://accounts.google.com/o/oauth2/auth",
            "token_uri": "https://oauth2.googleapis.com/token"
          }
          EOF

      - id: action
        uses: .
        with:
          args: --version
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp/credentials.json

      - name: Assert action succeeded with GOOGLE_APPLICATION_CREDENTIALS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when running firebase --version with GOOGLE_APPLICATION_CREDENTIALS set"
            exit 1
          fi
          echo "PASS: action succeeded with GOOGLE_APPLICATION_CREDENTIALS set"
