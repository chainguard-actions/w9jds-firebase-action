name: Test GOOGLE_APPLICATION_CREDENTIALS path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          args: --version
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-credentials.json
      - name: Assert action succeeded with GOOGLE_APPLICATION_CREDENTIALS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed when GOOGLE_APPLICATION_CREDENTIALS is set and running --version"
            exit 1
          fi
          echo "PASS: firebase --version ran successfully with GOOGLE_APPLICATION_CREDENTIALS"
