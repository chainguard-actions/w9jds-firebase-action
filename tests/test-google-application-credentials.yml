name: Test GOOGLE_APPLICATION_CREDENTIALS auth path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          args: --version
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/fake-credentials.json

      - name: Assert action passed auth check with GOOGLE_APPLICATION_CREDENTIALS
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The entrypoint checks that GOOGLE_APPLICATION_CREDENTIALS is non-empty
          # and then proceeds to run firebase. The command may succeed or fail
          # depending on whether firebase --version needs auth, but it must NOT
          # exit 126 (which would mean the auth check itself failed).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version succeeded with GOOGLE_APPLICATION_CREDENTIALS set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (auth check passed) but firebase command failed - acceptable"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
