name: Test firebase version command with token
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          args: --version
        env:
          FIREBASE_TOKEN: fake-token-for-version-check

      - name: Assert action ran firebase --version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # firebase --version does not require a valid token, so it should succeed.
          # If it fails for any reason (e.g. network issue pulling image), we still
          # accept failure as long as it is not due to missing credentials (which
          # would be exit 126 and caught in the no-credentials test).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version succeeded with FIREBASE_TOKEN set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (auth check passed) but firebase command failed - acceptable"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
