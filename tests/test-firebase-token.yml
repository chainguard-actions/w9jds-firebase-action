name: Test with FIREBASE_TOKEN credential
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          args: --version
        env:
          FIREBASE_TOKEN: fake-token-for-testing
        continue-on-error: true

      - name: Assert action ran past credential check
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With a fake token, firebase --version should still print the version
          # (--version does not require auth). Either success or a firebase-level
          # failure is acceptable, but exit 126 (no credentials) must NOT occur.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version succeeded with FIREBASE_TOKEN set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at firebase level (expected with fake token), but passed credential check"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
