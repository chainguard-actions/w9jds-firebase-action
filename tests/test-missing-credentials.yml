name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: firebase
        uses: .
        continue-on-error: true
        env:
          FIREBASE_CLI_TELEMETRY_OPTOUT: "1"
          FIREBASE_SKIP_UPDATE_CHECK: "1"
          CI: "true"
      - name: Assert action failed due to missing credentials
        if: always()
        env:
          OUTCOME: ${{ steps.firebase.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when no credentials were provided"
          else
            echo "FAIL: expected action to fail when no credentials are provided, but got outcome: $OUTCOME"
            exit 1
          fi
