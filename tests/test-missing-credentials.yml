name: Test missing credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action without credentials and expect failure
        id: action
        uses: .
        continue-on-error: true
        # No FIREBASE_TOKEN, GCP_SA_KEY, or GOOGLE_APPLICATION_CREDENTIALS set
      - name: Assert action failed with missing credentials
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no credentials are provided"
            exit 1
          fi
          echo "PASS: action correctly failed when no credentials were provided"
