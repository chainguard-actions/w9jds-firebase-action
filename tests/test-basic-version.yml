name: Test basic firebase version command
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: firebase
        uses: .
        continue-on-error: true
        env:
          FIREBASE_TOKEN: "fake-token-for-testing"
          FIREBASE_CLI_TELEMETRY_OPTOUT: "1"
          FIREBASE_SKIP_UPDATE_CHECK: "1"
          CI: "true"
      - name: Assert step completed successfully
        env:
          OUTCOME: ${{ steps.firebase.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase action completed successfully"
          else
            echo "FAIL: expected firebase action to succeed with FIREBASE_TOKEN set, got outcome: $OUTCOME"
            exit 1
          fi
