name: Test basic firebase version command
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          args: --version
        env:
          FIREBASE_TOKEN: fake-token-for-version-check
        continue-on-error: true

      - name: Assert firebase version command ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # firebase --version does not require real auth; it should succeed
          # even with a fake token since the entrypoint only checks token is non-empty
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (firebase may have tried to validate token); credentials check passed"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
