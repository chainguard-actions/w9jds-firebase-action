name: Test GCP service account key credential path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          args: --version
        env:
          # A minimal valid JSON object — passes the jq check in entrypoint.sh
          # so the key is stored and GOOGLE_APPLICATION_CREDENTIALS is set.
          # The firebase command itself will fail auth, but the credential
          # detection path is exercised.
          GCP_SA_KEY: '{"type":"service_account","project_id":"test-project","private_key_id":"key123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKFPmBNpFMBOFaHBqKH\n-----END RSA PRIVATE KEY-----\n","client_email":"test@test-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
        continue-on-error: true

      - name: Assert action ran with GCP_SA_KEY credential path
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The credential check passes (GCP_SA_KEY is set and valid JSON).
          # firebase --version may succeed or fail depending on auth; both are
          # acceptable — the important thing is the action did NOT exit 126.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version succeeded with GCP_SA_KEY set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past credential check (GCP_SA_KEY accepted) but firebase command failed — acceptable in harness"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
