name: Test GCP service account key auth path
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run firebase --version with GCP_SA_KEY (JSON format)
        id: action
        uses: .
        continue-on-error: true
        with:
          args: --version
        env:
          GCP_SA_KEY: |
            {
              "type": "service_account",
              "project_id": "test-project",
              "private_key_id": "key-id",
              "private_key": "-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqKFPmBCBMGdBMFGMSMH\n-----END RSA PRIVATE KEY-----\n",
              "client_email": "test@test-project.iam.gserviceaccount.com",
              "client_id": "123456789",
              "auth_uri": "https://accounts.google.com/o/oauth2/auth",
              "token_uri": "https://oauth2.googleapis.com/token"
            }

      - name: Assert action ran with GCP_SA_KEY
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should NOT exit 126 (missing credentials).
          # GCP_SA_KEY is valid JSON so it should be stored and GOOGLE_APPLICATION_CREDENTIALS set.
          # The firebase command may succeed or fail depending on the fake key, but it must run.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version succeeded with GCP_SA_KEY"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past credential check but firebase CLI rejected the fake key"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
