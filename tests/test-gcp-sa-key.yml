name: Test with GCP_SA_KEY auth method (JSON format)
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          args: --version
        env:
          GCP_SA_KEY: >-
            {"type":"service_account","project_id":"fake-project","private_key_id":"fake-key-id","private_key":"fake-key","client_email":"fake@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}
        continue-on-error: true

      - name: Assert action ran with GCP_SA_KEY set
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The entrypoint should pass the credential check since GCP_SA_KEY is set.
          # It will parse the JSON key and store it in /opt/gcp_key.json.
          # firebase --version may succeed or fail depending on credential validation,
          # but the action should NOT exit 126 (missing credentials).
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with GCP_SA_KEY set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran past credential check (firebase may have rejected fake SA key)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
