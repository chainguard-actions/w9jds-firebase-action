name: Test GCP service account key credential path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          # Provide a fake GCP SA key in JSON format so the jq check passes
          # and the key gets written to /opt/gcp_key.json.
          # The firebase command itself may fail with auth errors, but the
          # credential setup path in entrypoint.sh should be exercised.
          GCP_SA_KEY: '{"type":"service_account","project_id":"fake-project","private_key_id":"fake-key-id","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqnBMgNBGMFhFGMFhFGM\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
        with:
          args: --help
      - name: Assert action ran (credential setup path exercised)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with GCP_SA_KEY JSON credential"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (fake credentials cannot authenticate to Firebase)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
