name: Test with base64-encoded GCP_SA_KEY credential
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Prepare base64-encoded fake GCP SA key
        id: prep
        run: |
          FAKE_JSON='{"type":"service_account","project_id":"fake-project","private_key_id":"key123","client_email":"fake@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}'
          ENCODED=$(echo "$FAKE_JSON" | base64 -w 0)
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          args: --version
        env:
          # Base64-encoded JSON key — entrypoint will detect it's not valid JSON and decode it
          GCP_SA_KEY: ${{ steps.prep.outputs.encoded }}
        continue-on-error: true

      - name: Assert action handled base64 GCP_SA_KEY correctly
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The entrypoint should detect the value is not valid JSON, base64-decode it,
          # and write it to /opt/gcp_key.json. Firebase auth will fail with a fake key,
          # but the credential handling path should not cause exit 126.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with base64 GCP_SA_KEY"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at firebase level (expected with fake key), base64 decode path worked"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
