name: Test basic firebase-action usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        env:
          FIREBASE_TOKEN: "dummy-token-for-ci"
        with:
          args: --version
      - name: Assert action completed successfully
        run: |
          echo "Action step completed without error"
          echo "PASS: firebase --version ran successfully"
