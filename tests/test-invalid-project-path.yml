name: Test invalid PROJECT_PATH fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          args: --version
        env:
          FIREBASE_TOKEN: dummy-token-not-used-for-version
          PROJECT_PATH: does-not-exist-dir-xyz
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent PROJECT_PATH"
            exit 1
          fi
          echo "PASS"
