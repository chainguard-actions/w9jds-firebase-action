name: Test with FIREBASE_TOKEN credential
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          args: --version
        env:
          FIREBASE_TOKEN: fake-token-for-version-check
        continue-on-error: true

      - name: Assert action ran (passed credential check, firebase --version may succeed or fail)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should pass the credential check (FIREBASE_TOKEN is set).
          # 'firebase --version' does not require a real token, so it may succeed.
          # If it fails for another reason (e.g. network), that is also acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with FIREBASE_TOKEN set"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (credential check passed) but firebase command failed (expected in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
