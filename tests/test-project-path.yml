name: Test PROJECT_PATH changes directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project directory
        run: mkdir -p "$GITHUB_WORKSPACE/firebase-project"
      - id: action
        uses: .
        with:
          args: --version
        env:
          FIREBASE_TOKEN: dummy-token
          PROJECT_PATH: firebase-project
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
      - id: bad
        uses: .
        continue-on-error: true
        with:
          args: --version
        env:
          FIREBASE_TOKEN: dummy-token
          PROJECT_PATH: does-not-exist-dir
      - name: Assert nonexistent PROJECT_PATH fails
        env:
          OUTCOME: ${{ steps.bad.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for missing PROJECT_PATH"
            exit 1
          fi
          echo "PASS"
