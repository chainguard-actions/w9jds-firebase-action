name: Test PROJECT_PATH valid directory
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create project directory
        run: mkdir -p "$GITHUB_WORKSPACE/fb-project"
      - id: action
        uses: .
        with:
          args: --version
        env:
          FIREBASE_TOKEN: dummy-token-not-used-for-version
          PROJECT_PATH: fb-project
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success"
            exit 1
          fi
          echo "PASS"
