name: Test firebase version command
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run firebase --version with fake token
        id: action
        uses: .
        with:
          args: --version
        env:
          FIREBASE_TOKEN: fake-ci-token-for-version-check
        continue-on-error: true

      - name: Assert action ran (version printed or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: firebase --version succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake token on some commands)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
